<svg xmlns="http://www.w3.org/2000/svg" class="oscur-dg" viewBox="0 0 1180 1126" width="1180" height="1126"
     role="img" aria-labelledby="vision-title">
  <title id="vision-title">OSCUR’s urban cyberinfrastructure for data discovery, curation and transformation, data management, analytics and visualization, serving city agencies, researchers, residents, policy makers, infrastructure and smart city systems, toward healthier, more accessible, sustainable and resilient cities</title>
  <style>
    .oscur-dg text { font-family: var(--vp-font-family-base, Inter, ui-sans-serif, system-ui, sans-serif); }
    .oscur-dg .dg-ink { fill: var(--oscur-dg-ink, #1f1f1f); }
    .oscur-dg .dg-ink-2 { fill: var(--oscur-dg-ink-2, #6b6b6b); }
    .oscur-dg .dg-panel { fill: var(--oscur-dg-panel, #f2f2f2); }
    .oscur-dg .dg-surface { fill: var(--oscur-dg-surface, #ffffff); }
    .oscur-dg .dg-surface-2 { fill: var(--oscur-dg-surface-2, #e8e8e8); }
    .oscur-dg .dg-blue { fill: var(--oscur-dg-blue, #4f81bd); }
    .oscur-dg .dg-on-blue { fill: var(--oscur-dg-on-blue, #ffffff); }
    .oscur-dg .dg-blue-soft { fill: var(--oscur-dg-blue-soft, #c9d6e6); }
    .oscur-dg .dg-blue-text { fill: var(--oscur-dg-blue-text, #3b6db0); }
    .oscur-dg .dg-green { fill: var(--oscur-dg-green, #70ad47); }
    .oscur-dg .dg-green-text { fill: var(--oscur-dg-green-text, #4a7a2c); }
    .oscur-dg .dg-land { fill: var(--oscur-dg-land, #fafafa); }
    .oscur-dg .dg-sea { fill: var(--oscur-dg-sea, #d5dadc); }
    .oscur-dg .dg-no-fill { fill: none; }
    .oscur-dg .dg-s-ink { stroke: var(--oscur-dg-ink, #1f1f1f); }
    .oscur-dg .dg-s-ink-2 { stroke: var(--oscur-dg-ink-2, #6b6b6b); }
    .oscur-dg .dg-s-blue { stroke: var(--oscur-dg-blue, #4f81bd); }
    .oscur-dg .dg-s-border { stroke: var(--oscur-dg-border, #c9c9c9); }
    .oscur-dg .dg-s-surface { stroke: var(--oscur-dg-surface, #ffffff); }
    .oscur-dg .dg-halo { paint-order: stroke fill; stroke: var(--oscur-dg-surface, #ffffff); stroke-linejoin: round; }
  </style>
  <!-- Icons: Font Awesome Free 6 (CC BY 4.0), https://fontawesome.com/license/free -->
  <defs>
    <!-- baseline of the four blue words: a circle run clockwise from its bottom point -->
    <path id="vision-ring" d="M587 1113.7A550.5 550.5 0 0 1 587 12.7A550.5 550.5 0 0 1 587 1113.7"/>
  </defs>

  <!-- Outer circle, open under the four words -->
  <g class="dg-no-fill dg-s-ink" stroke-width="3">
    <path d="M70.6 344.1A561 561 0 0 1 266.3 102.9"/>
    <path d="M414.3 29.5A561 561 0 0 1 855.9 70.8"/>
    <path d="M1070.7 279A561 561 0 0 1 1118.3 383.2"/>
    <path d="M1130.6 701.9A561 561 0 0 1 26.3 582.7"/>
  </g>

  <!-- Health, Accessibility, Sustainability, Resilience, set along the outer circle -->
  <g class="dg-blue-text" font-size="46.5" font-weight="700" text-anchor="middle">
    <text><textPath href="#vision-ring" startOffset="965.6">Resilience</textPath></text>
    <text><textPath href="#vision-ring" startOffset="1475.8">Health</textPath></text>
    <text><textPath href="#vision-ring" startOffset="2153.2">Accessibility</textPath></text>
    <text><textPath href="#vision-ring" startOffset="2573">Sustainability</textPath></text>
  </g>

  <!-- Light-blue disc with a dashed outline -->
  <circle class="dg-blue-soft dg-s-ink-2" cx="587" cy="571.3" r="456.1" stroke-width="2" stroke-dasharray="14.5 5.4"/>

