  <!-- OSCUR box and its tools -->
  <g>
    <rect class="dg-blue dg-s-ink" x="313" y="308.5" width="548" height="525.5" rx="25" stroke-width="2"/>
    <g font-size="30" font-weight="700" text-anchor="middle">
      <!-- Data discovery -->
      <g>
        <circle class="dg-surface dg-s-ink" cx="468.2" cy="388.5" r="64.5" stroke-width="2.2"/>
        <svg x="427.2" y="347.5" width="82" height="82" viewBox="0 0 512 512"><path class="dg-ink" d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"/></svg>
        <text class="dg-on-blue" x="468.2" y="489">Data discovery</text>
      </g>
      <!-- Curation & transformation: a cone and a cube with a curved arrow (drawn) -->
      <g>
        <circle class="dg-surface dg-s-ink" cx="704.7" cy="388.5" r="64.5" stroke-width="2.2"/>
        <g stroke-linejoin="round" stroke-linecap="round">
          <!-- cone: lit side outlined, shaded side solid -->
          <path class="dg-no-fill dg-s-ink" stroke-width="3" d="M688 342L715.7 388.3M677 394.3A27.7 6.5 0 0 0 715.7 388.3"/>
          <path class="dg-ink dg-s-ink" stroke-width="2" d="M688 342L660.3 388.3A27.7 6.5 0 0 0 677 394.3Z"/>
          <!-- cube: left face solid, top and right faces outlined -->
          <path class="dg-surface dg-s-ink" stroke-width="3.5" d="M694.5 385L723 371.7L751.5 385L751.5 422L723 435.3L694.5 422ZM723 398.3L751.5 385"/>
          <path class="dg-ink dg-s-ink" stroke-width="3.5" d="M694.5 385L723 398.3L723 435.3L694.5 422Z"/>
          <!-- curved arrow from the cube back to the cone -->
          <path class="dg-no-fill dg-s-ink" stroke-width="3.5" d="M740.6 369.9A25 25 0 0 0 719.6 353.1"/>
          <path class="dg-ink dg-s-ink" stroke-width="1.5" d="M705.5 353.2L717.5 346.2L717.5 360.2Z"/>
        </g>
        <text class="dg-on-blue" x="704.7" y="489">Curation &amp;</text>
        <text class="dg-on-blue" x="704.7" y="527">transformation</text>
      </g>
      <!-- Data management -->
      <g>
        <circle class="dg-surface dg-s-ink" cx="411.3" cy="671.5" r="64.5" stroke-width="2.2"/>
        <svg x="370.2" y="624.5" width="82.2" height="94" viewBox="0 0 448 512"><path class="dg-ink" d="M448 80l0 48c0 44.2-100.3 80-224 80S0 172.2 0 128L0 80C0 35.8 100.3 0 224 0S448 35.8 448 80zM393.2 214.7c20.8-7.4 39.9-16.9 54.8-28.6L448 288c0 44.2-100.3 80-224 80S0 332.2 0 288L0 186.1c14.9 11.8 34 21.2 54.8 28.6C99.7 230.7 159.5 240 224 240s124.3-9.3 169.2-25.3zM0 346.1c14.9 11.8 34 21.2 54.8 28.6C99.7 390.7 159.5 400 224 400s124.3-9.3 169.2-25.3c20.8-7.4 39.9-16.9 54.8-28.6l0 85.9c0 44.2-100.3 80-224 80S0 476.2 0 432l0-85.9z"/></svg>
        <text class="dg-on-blue" x="411.3" y="773">Data</text>
        <text class="dg-on-blue" x="411.3" y="811">management</text>
      </g>
      <!-- Analytics: a network of six nodes (drawn) -->
      <g>
        <circle class="dg-surface dg-s-ink" cx="588" cy="671.5" r="64.5" stroke-width="2.2"/>
        <g class="dg-s-ink">
          <path class="dg-no-fill" stroke-width="3.5" d="M588.1 633.9L551 649M588.1 633.9L625 672.7M588.1 633.9L550.7 693M551 649L588.2 668.4M551 649L588.2 709.1M588.2 668.4L625 672.7M588.2 668.4L588.2 709.1M625 672.7L588.2 709.1M550.7 693L588.2 709.1"/>
          <g class="dg-surface" stroke-width="3">
            <circle cx="588.1" cy="633.9" r="11.5"/>
            <circle cx="551" cy="649" r="11.5"/>
            <circle cx="588.2" cy="668.4" r="9.3"/>
            <circle cx="625" cy="672.7" r="11.5"/>
            <circle cx="550.7" cy="693" r="11.5"/>
            <circle cx="588.2" cy="709.1" r="11.5"/>
          </g>
        </g>
        <text class="dg-on-blue" x="588" y="773">Analytics</text>
      </g>
      <!-- Visualization -->
      <g>
        <circle class="dg-surface dg-s-ink" cx="764.2" cy="671.5" r="64.5" stroke-width="2.2"/>
        <svg x="724.2" y="625.8" width="80" height="91.4" viewBox="0 0 448 512"><path class="dg-ink" d="M160 80c0-26.5 21.5-48 48-48l32 0c26.5 0 48 21.5 48 48l0 352c0 26.5-21.5 48-48 48l-32 0c-26.5 0-48-21.5-48-48l0-352zM0 272c0-26.5 21.5-48 48-48l32 0c26.5 0 48 21.5 48 48l0 160c0 26.5-21.5 48-48 48l-32 0c-26.5 0-48-21.5-48-48L0 272zM368 96l32 0c26.5 0 48 21.5 48 48l0 288c0 26.5-21.5 48-48 48l-32 0c-26.5 0-48-21.5-48-48l0-288c0-26.5 21.5-48 48-48z"/></svg>
        <text class="dg-on-blue" x="764.2" y="773">Visualization</text>
      </g>
    </g>
    <text class="dg-on-blue" x="587" y="588" font-size="68" font-weight="800" text-anchor="middle">OSCUR</text>
  </g>

  <!-- Caption -->
  <text class="dg-ink" x="587" y="869" font-size="36" text-anchor="middle">Urban cyberinfrastructure</text>
</svg>
