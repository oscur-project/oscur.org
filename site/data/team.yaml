# People of OSCUR. /team/ shows the groups below in order: the PIs as photo cards in one column per OSCUR
# site, the others as lists, then alumni with what they do now. Author names in papers.bib that match a
# person's `name` or one of their `aliases` link to the person's `url`.
#
# person: id, name, url, institution (an id below), group (an id below), role, photo, note, alumni,
# listed (false: linked from papers but not on /team/), aliases

institutions:
  - { id: nyu, name: New York University, short: NYU, url: "https://www.nyu.edu/" }
  - { id: uic, name: University of Illinois Chicago, short: UIC, url: "https://www.uic.edu/" }
  - { id: uw, name: University of Washington, short: UW, url: "https://www.washington.edu/" }
  # Partner institutions named on software cards.
  - { id: uff, name: Universidade Federal Fluminense, short: UFF, url: "https://www.uff.br/" }
  - { id: fgv, name: Fundação Getulio Vargas, short: FGV, url: "https://portal.fgv.br/" }
  - { id: berkeley, name: "University of California, Berkeley", short: UC Berkeley, url: "https://www.berkeley.edu/" }
  - { id: utokyo, name: The University of Tokyo, short: U Tokyo, url: "https://www.u-tokyo.ac.jp/en/" }

groups:
  - { id: pis, label: PIs, cards: true }
  - { id: scientists, label: Research scientists }
  - { id: staff, label: Research staff }
  - { id: phd, label: PhD students }
  - { id: students, label: Undergraduate and high school students }
  - { id: interns, label: Interns and visiting students }

